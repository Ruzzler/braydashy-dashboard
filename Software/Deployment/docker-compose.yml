# Reference layout since 2026-11-07 (the live container is created by unraid-cutover.sh).
# The image only supplies Node and node_modules; the app itself runs from a Forgejo release
# in /mnt/user/Projects/deploy/braydashy (releases/vX.Y.Z + current.json + run.js).
services:
  braydashy:
    image: ghcr.io/ruzzler/braydashy-dashboard:latest
    container_name: BrayDashy
    restart: unless-stopped
    command: ["node", "/app/deploy/run.js"]
    ports:
      - "3050:3050"
    volumes:
      - /mnt/user/appdata/braydashy:/app/data
      - /mnt/user/Projects/deploy/braydashy:/app/deploy
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:3050]/"
      net.unraid.docker.icon: "https://raw.githubusercontent.com/Ruzzler/braydashy-dashboard/main/icon.png"
